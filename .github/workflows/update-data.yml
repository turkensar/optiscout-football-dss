name: update-data

# Her pazartesi Big-5 istatistiklerini ve Transfermarkt verisini Kaggle'dan indirir,
# testler gecerse degisen veri dosyalarini repoya commit'ler.
# Elle calistirmak icin: Actions -> update-data -> Run workflow.
#
# Gerekli repo sirlari (Settings -> Secrets and variables -> Actions):
#   KAGGLE_USERNAME, KAGGLE_KEY   (kaggle.com -> Settings -> API -> Create New Token)
on:
  schedule:
    - cron: "17 4 * * 1"   # pazartesi 04:17 UTC (07:17 TR)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest kaggle

      - name: Kaggle anahtarini kontrol et
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::error::KAGGLE_USERNAME / KAGGLE_KEY sirlari tanimli degil (README: Veri guncelleme)."
            exit 1
          fi

      - name: Veriyi guncelle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: python scripts/update_data.py

      - name: Testler
        run: python -m pytest -q

      - name: Degisiklik varsa commit'le
        run: |
          git add data/players_data_light-2026_2027.csv data/market_values.csv data/data_versions.json
          if git diff --cached --quiet -- data/players_data_light-2026_2027.csv data/market_values.csv; then
            echo "Veride degisiklik yok; commit atilmadi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Veri guncellemesi: $(date -u +%Y-%m-%d)"
          git push
