name: tests

# Her push ve pull request'te testleri GitHub'in sunucusunda otomatik calistirir.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        pandas: ["latest"]
        include:
          # Bircok kullanicinin bilgisayarindaki eski pandas 2.x surumu: bos (NaN) degerlerle
          # ilgili davranis farklarini yakalamak icin (bkz. test_leagues kaleci maskesi)
          - python-version: "3.11"
            pandas: "2.x"

    name: pytest (py${{ matrix.python-version }}, pandas ${{ matrix.pandas }})
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bagimliliklari kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          if [ "${{ matrix.pandas }}" = "2.x" ]; then pip install "pandas>=2.2,<3"; fi
          python -c "import pandas; print('pandas', pandas.__version__)"

      - name: Testleri calistir
        run: python -m pytest -q
